name: Project build

on:
  workflow_run:
    workflows: [Docker build]
    types: [completed]
  # TODO: Limit base container rebuilds to "on-demand"?

jobs:
  project_build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/andymender/raylib_base:latest
    permissions:
      packages: read
      contents: read
    env:
      CC: clang-20
      CXX: clang++-20
    steps:
      # NOTE: Required step!
      - name: Do repository checkout
        uses: actions/checkout@v5
      - name: Build project
        run: |
          echo "Starting build..."
          cmake -S . -B build
 