name: Docker build

on:
  # TODO: Limit base container rebuilds to "on-demand"?
  pull_request:
    branches:
      - 'main'
  push:
    branches:
      - 'main'

jobs:
  docker_build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      # NOTE: Required step!
      - name: Do repository checkout
        uses: actions/checkout@v5

      # NOTE: Required step!
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Build docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          # TODO: Add an extra versioned tag?
          tags: |
            ghcr.io/andymender/builder_all:latest
